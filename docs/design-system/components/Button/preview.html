<!-- @dsCard group="Actions" height=150 subtitle="Primary, secondary, quiet" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-text);} .wrap{padding:24px;} :focus-visible{outline:2px solid var(--sky-700);outline-offset:2px;}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{font:600 15px/20px var(--font-text);min-height:44px;padding:0 18px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.primary{background:var(--gold-500);color:var(--ink)}
.primary:hover{background:var(--gold-300)}
.secondary{background:var(--surface);color:var(--ink);border-color:var(--line-control)}
.secondary:hover{background:var(--surface-sunk)}
.quiet{background:none;color:var(--sky-700);padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.45;cursor:not-allowed}
</style>
<div class="wrap"><div class="row">
<button class="btn primary">Submit statement</button>
<button class="btn secondary">Sign in</button>
<button class="btn quiet">Add source</button>
<button class="btn primary" disabled>Submitting…</button>
</div></div>
