<!-- @dsCard group="Proposals" height=170 subtitle="Vote on a proposal" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-text);} .wrap{padding:24px;} :focus-visible{outline:2px solid var(--sky-700);outline-offset:2px;}
.vote{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:var(--measure-text)}
.v{min-height:52px;border-radius:var(--radius-sm);border:1px solid var(--line-control);background:var(--surface);font:600 15px/18px var(--font-text);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.v span{font-size:16px}
.v.ap.sel{background:var(--green-700);border-color:var(--green-700);color:var(--surface)}
.v.ab.sel{background:var(--surface-sunk);border-color:var(--ink-muted)}
.v.dis.sel,.v.no.sel{background:var(--earth-700);border-color:var(--earth-700);color:var(--surface)}
.v.no{border-width:2px}
.note{margin-top:12px;font:400 14px/20px var(--font-text);color:var(--ink-muted)}
</style>
<div class="wrap"><div class="vote" role="radiogroup" aria-label="Your vote">
<button class="v ap sel" role="radio" aria-checked="true"><span>✓</span>Approve</button>
<button class="v ab" role="radio" aria-checked="false"><span>○</span>Abstain</button>
<button class="v dis" role="radio" aria-checked="false"><span>✗</span>Disapprove</button>
<button class="v no" role="radio" aria-checked="false"><span>✗✗</span>Strong no</button>
</div><p class="note">You voted Approve. You can change your vote until voting closes.</p></div>
